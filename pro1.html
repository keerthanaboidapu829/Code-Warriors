<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NearbyCare — Colourful Prototype</title>
<style>
  :root {
    --accent:#0077ff;
    --danger:#e63946;
    --muted:#555;
    --bg:#eaf6ff;
  }
  body {
    font-family: "Poppins", sans-serif;
    margin:0;
    color:#111;
    background: linear-gradient(135deg, #eaf6ff 0%, #fefefe 50%, #d1ecff 100%);
    background-attachment: fixed;
  }

  header {
    background: linear-gradient(90deg,#0077ff,#00b4d8);
    color:#fff;
    padding:18px 22px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    position: relative;
  }

  header::after {
    content:"";
    background:url('https://images.unsplash.com/photo-1580281657521-66b8f18c77a5?auto=format&fit=crop&w=1600&q=60') center/cover no-repeat;
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    opacity:0.15;
    z-index:0;
  }
  header h1, header .small {
    position:relative; z-index:1;
  }

  main {
    display:grid;
    grid-template-columns:1fr 380px;
    gap:14px;
    padding:14px;
    min-height:calc(100vh - 90px);
  }

  .panel {
    background:#fff;
    border-radius:10px;
    box-shadow:0 5px 18px rgba(0,0,0,0.07);
    padding:14px;
    overflow:auto;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .panel:hover {
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
  }

  #map {
    height:100%;
    min-height:460px;
    border-radius:10px;
    background:url('https://images.unsplash.com/photo-1526256262350-7da7584cf5eb?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;
  }

  button {
    margin:6px 4px;
    padding:9px 12px;
    border-radius:6px;
    border:1px solid #ddd;
    cursor:pointer;
    font-weight:600;
  }
  .btn-primary { background:var(--accent); color:#fff; border:none; }
  .btn-danger { background:var(--danger); color:#fff; border:none; }
  .btn-warning { background:#ffbf69; border:none; color:#111; }

  .place-item {
    padding:10px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .place-item img {
    width:60px;
    height:60px;
    border-radius:8px;
    object-fit:cover;
  }

  label {
    display:block;
    font-weight:600;
    margin-top:8px;
  }
  input[type="text"], textarea {
    width:100%;
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
    margin-top:5px;
    font-size:14px;
  }
  .small { font-size:13px; color:var(--muted); }
  footer {
    text-align:center;
    padding:12px;
    background:#f0faff;
    color:#333;
    font-size:14px;
  }
  .pill {
    display:inline-block;
    background:#e0f7ff;
    padding:6px 8px;
    border-radius:999px;
    margin-right:6px;
    font-weight:600;
  }
  .danger-banner {
    background:#fff0f0;
    border-left:4px solid var(--danger);
    padding:8px;
    margin:8px 0;
    border-radius:6px;
  }

  @media(max-width:960px){
    main{grid-template-columns:1fr;min-height:auto}
    #map{min-height:320px;}
  }
</style>

<script>
  const GOOGLE_MAPS_API_KEY = ''; // add your key if needed
</script>
</head>

<body>
<header>
  <h1>NearbyCare — Health & Emergency Assistant 🌍</h1>
  <div class="small">Find hospitals, pharmacies, injury help & more</div>
</header>

<main>
  <!-- Left: Map -->
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <button id="btn-locate" class="btn-primary">📍 My Location</button>
        <button id="btn-accident" class="btn-warning">⚠️ Simulate Accident</button>
      </div>
      <span id="status" class="small"></span>
    </div>
    <div id="map">Loading map...</div>
    <div style="margin-top:10px;">
      <select id="place-type" style="padding:8px;border-radius:6px;border:1px solid #ddd">
        <option value="hospital">Hospitals</option>
        <option value="clinic">Clinics</option>
        <option value="pharmacy" selected>Pharmacies</option>
      </select>
      <button id="btn-find" class="btn-primary">Find Nearby</button>
    </div>
    <div id="places-list" style="max-height:240px;overflow:auto;margin-top:8px;"></div>
  </div>

  <!-- Right: Actions -->
  <div class="panel">
    <h3>Quick Assistance</h3>
    <label>Upload injury image (mock)</label>
    <input type="file" id="injury-image" accept="image/*"/>
    <div id="image-result" class="small" style="margin-top:8px"></div>

    <hr/>
    <label>Describe your symptoms</label>
    <textarea id="symptoms" rows="3" placeholder="e.g. fever, cough, chest pain"></textarea>
    <button id="btn-check-symptoms" class="btn-primary" style="margin-top:8px">Check Symptoms</button>
    <div id="symptom-result" style="margin-top:8px"></div>

    <hr/>
    <label>Medicine availability</label>
    <input type="text" id="medicine-name" placeholder="Enter medicine name..."/>
    <button id="btn-check-medicine" class="btn-primary" style="margin-top:8px">Check Availability</button>
    <div id="medicine-result" style="margin-top:8px"></div>

    <hr/>
    <button id="btn-emergency" class="btn-danger" style="width:100%;font-size:15px;">🚨 Emergency Call</button>
  </div>
</main>

<footer>
  © 2025 NearbyCare Prototype — Designed for Demo Purposes Only
</footer>

<script>
const MOCK_STORES = [
  {name:'City Hospital',type:'hospital',img:'https://images.unsplash.com/photo-1580281657521-66b8f18c77a5?auto=format&fit=crop&w=400&q=60'},
  {name:'Green Pharmacy',type:'pharmacy',img:'https://images.unsplash.com/photo-1586788224331-947f9cd8df1d?auto=format&fit=crop&w=400&q=60'},
  {name:'Downtown Clinic',type:'clinic',img:'https://images.unsplash.com/photo-1627308595229-7830a5c91f9f?auto=format&fit=crop&w=400&q=60'}
];

const MOCK_INVENTORY = {
  'Green Pharmacy':['paracetamol','ibuprofen','amoxicillin'],
  'City Hospital':['paracetamol','iv-fluids'],
  'Downtown Clinic':['paracetamol']
};

function renderPlaceList(list){
  const c=document.getElementById('places-list');
  c.innerHTML='';
  list.forEach(p=>{
    const el=document.createElement('div');
    el.className='place-item';
    el.innerHTML=`<img src="${p.img}" alt="img"/><div><strong>${p.name}</strong><br><span class="small">${p.type}</span></div>`;
    c.appendChild(el);
  });
}

document.getElementById('btn-find').onclick=()=>{
  renderPlaceList(MOCK_STORES);
  document.getElementById('status').textContent='Showing mock nearby places';
};

document.getElementById('btn-check-medicine').onclick=()=>{
  const name=document.getElementById('medicine-name').value.toLowerCase();
  const res=document.getElementById('medicine-result');
  const found=Object.entries(MOCK_INVENTORY).filter(([store,meds])=>meds.some(m=>m.includes(name)));
  if(!found.length) res.innerHTML=`❌ No stores have "${name}"`;
  else res.innerHTML=found.map(([s,meds])=>`✅ ${s} has ${meds.join(', ')}`).join('<br>');
};

document.getElementById('btn-locate').onclick=()=>{alert("Using mock location for now.")};
document.getElementById('btn-accident').onclick=()=>{alert("Simulated accident nearby — showing hospitals")};
document.getElementById('btn-check-symptoms').onclick=()=>{document.getElementById('symptom-result').innerHTML="Basic self-care suggested. Drink water and rest."};
document.getElementById('injury-image').onchange=()=>{document.getElementById('image-result').innerHTML="Image analyzed (mock). Possible arm injury — apply antiseptic & wrap dressing."};
document.getElementById('btn-emergency').onclick=()=>{alert("Call emergency number immediately!")};

renderPlaceList(MOCK_STORES);
</script>
</body>
</html>
